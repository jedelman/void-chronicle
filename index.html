<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Chronicle - Bluesky RPG</title>
    <script type="importmap">
    {
        "imports": {
            "@atproto/api": "https://esm.sh/@atproto/api@0.18.21"
        }
    }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.2rem;
            margin-bottom: 3rem;
        }

        #login-section {
            display: block;
        }

        #main-app {
            display: none;
            text-align: left;
        }

        .login-btn {
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .user-profile {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .user-info h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .user-info p {
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 1rem;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .action-btn.primary {
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            border: none;
        }

        #content-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            min-height: 400px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #a0a0a0;
        }

        .error {
            background: rgba(255, 82, 82, 0.2);
            border: 1px solid rgba(255, 82, 82, 0.5);
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
        }

        /* Character Sheet Styles */
        .stat-card {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.2);
        }

        .characteristic-card {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 3px solid #00d4ff;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .characteristic-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .verb-icon {
            font-size: 1.5rem;
        }

        .post-preview {
            color: #e0e0e0;
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            font-style: italic;
        }

        .characteristic-note {
            color: #e0e0e0;
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 5px;
        }

        .view-post-link {
            color: #00d4ff;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .view-post-link:hover {
            color: #00ff88;
            text-decoration: underline;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            height: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            transition: width 0.5s ease;
        }

        .section-header {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-dashboard {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }

        /* Chronicle Timeline Styles */
        .chronicle-timeline {
            position: relative;
            padding: 20px 0;
        }

        .timeline-line {
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, #00d4ff, #7b2cbf);
        }

        .chronicle-event {
            position: relative;
            padding-left: 50px;
            margin-bottom: 30px;
        }

        .chronicle-icon {
            position: absolute;
            left: 11px;
            top: 5px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .chronicle-content {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .event-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .event-label {
            font-weight: 600;
            color: #e0e0e0;
        }

        .event-timestamp {
            font-size: 0.85rem;
            color: #a0a0a0;
            margin-bottom: 8px;
        }

        .event-note {
            color: #e0e0e0;
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 5px;
        }

        .scroll-sentinel {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-spinner {
            display: none;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Void Chronicle</h1>
        <p class="subtitle">Collaborative Storytelling on Bluesky</p>

        <!-- Login Section -->
        <div id="login-section">
            <form id="login-form" style="max-width: 400px; margin: 0 auto; text-align: left;">
                <div style="margin-bottom: 20px;">
                    <label for="handle" style="display: block; margin-bottom: 8px; font-size: 0.9rem;">Bluesky Handle:</label>
                    <input type="text" id="handle" placeholder="@handle.bsky.social" required
                        style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #e0e0e0; font-size: 1rem;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label for="app-password" style="display: block; margin-bottom: 8px; font-size: 0.9rem;">App Password:</label>
                    <input type="password" id="app-password" placeholder="xxxx-xxxx-xxxx-xxxx" required
                        style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #e0e0e0; font-size: 1rem;">
                    <p style="font-size: 0.8rem; color: #a0a0a0; margin-top: 8px;">
                        Create an app password at <a href="https://bsky.app/settings/app-passwords" target="_blank" style="color: #00d4ff;">bsky.app/settings/app-passwords</a>
                    </p>
                </div>

                <button type="submit" class="login-btn" style="width: 100%;">Login</button>
            </form>
        </div>

        <!-- Main Application -->
        <div id="main-app">
            <div class="user-profile">
                <div class="avatar" id="user-avatar">@</div>
                <div class="user-info">
                    <h2 id="user-handle">@handle.bsky.social</h2>
                    <p id="user-did">did:plc:xxx</p>
                </div>
            </div>

            <div class="actions">
                <button class="action-btn primary" id="btn-create-characteristic">Create Characteristic</button>
                <button class="action-btn primary" id="btn-create-chapter">Create Chapter</button>
                <button class="action-btn" id="btn-chronicle">Chronicle View</button>
                <button class="action-btn" id="btn-character-sheet">Character Sheet</button>
            </div>

            <div id="content-area">
                <div class="loading">Select an action above...</div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
